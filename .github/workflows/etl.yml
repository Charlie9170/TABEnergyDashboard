name: ETL Data Updates

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: etl-data-updates
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync with latest main
        run: git pull origin main --no-rebase

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run EIA Fuel Mix ETL
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python etl/eia_fuelmix_etl.py
        continue-on-error: true

      - name: Run ERCOT Price Map ETL
        run: python etl/ercot_lmp_etl.py
        continue-on-error: true

      - name: Run EIA Plants ETL
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python etl/eia_plants_etl.py

      - name: Run GIS Queue ETL
        run: python etl/ercot_gis_queue_etl.py

      - name: Validate generation parquet
        run: python scripts/validate_generation_parquet.py

      - name: Validate GIS queue parquet
        run: python scripts/validate_gis_queue_parquet.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/*.parquet data/queue_gis_metadata.json || true

          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .streamlit_trigger
          git add .streamlit_trigger

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "🤖 Auto-update: $(date -u +"%Y-%m-%d %H:%M UTC")"

          git push origin main || (
            git pull origin main --no-rebase -X ours --no-edit &&
            git push origin main
          )
